name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest httpx

      - name: Run tests
        env:
          LAMBDA_URL_ORIGINAL: http://fake-original.lambda-url/
          LAMBDA_URL_FINETUNED: http://fake-finetuned.lambda-url/
          QDRANT_URL: http://fake-qdrant/
          QDRANT_API_KEY: fake-key
          QDRANT_COLLECTION: furniture_items
        run: pytest tests/ -v
